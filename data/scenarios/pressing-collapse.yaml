id: pressing-collapse
description: >-
  Northbridge press hard, win the ball high and lead 2-0. Around 55 minutes the front
  line tires and they stop pressing; Harbour City, who trail, start to play through
  midfield at will. The pipeline is never told this: it has to notice how far the
  nearest defender stands from the ball, the pressure and sprint counts, then explain what it
  means for the match.
home: HAR
away: NOR
seed: 15
script:
  - at: "55:00"
    team: NOR
    change: { press_intensity: -0.80, press_height: -0.70, line_height: -0.40 }
  - at: "70:00"
    team: HAR
    event: substitution
