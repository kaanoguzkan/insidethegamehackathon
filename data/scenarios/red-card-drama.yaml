id: red-card-drama
description: >-
  A tight match turns on a sending-off. Redmoor lose a defender just before the hour and
  reorganise: a striker is withdrawn for a packed midfield (4-4-2 becomes a 4-1-4-1) and they
  defend with ten. Saltmarsh, a side that normally sits back, start pressing high and push to a
  back three with wing-backs to punish them. The pipeline sees the card as an event and has to
  notice and explain what happens next.
home: RED
away: SAL
seed: 32
script:
  - at: "58:00"
    team: RED
    event: red_card
  - at: "59:00"
    team: RED
    formation: "4-1-4-1"
  - at: "60:00"
    team: SAL
    change: { press_intensity: 0.3, press_height: 0.4 }
    formation: "3-4-3"
