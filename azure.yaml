# Azure Developer CLI service map. `azd up` provisions infra/ and deploys both services.
name: matchmind
metadata:
  template: matchmind@0.1.0
infra:
  provider: bicep
  path: infra
services:
  brain:
    project: .
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
      # ACR cloud builds (Tasks) are refused on new and free subscriptions, so build locally. Azure runs amd64, so force it
      # on Apple Silicon too.
      remoteBuild: false
      platform: linux/amd64
  functions:
    project: ./apps/functions
    host: function
    language: python
    hooks:
      # The Functions run the interpreter, so the package carries the matchmind code and the league data it is calibrated with.
      prepackage:
        shell: sh
        run: rm -rf matchmind data && cp -R ../../src/matchmind ./matchmind && mkdir -p data && cp -R ../../data/league ./data/league && find matchmind -name __pycache__ -prune -exec rm -rf {} +
  web:
    project: ./web
    host: staticwebapp
    language: js
    dist: dist
    hooks:
      prebuild:
        shell: sh
        run: pnpm install --frozen-lockfile && pnpm sync
hooks:
  # Things that need the deployed code: the simulator job's image, and the Event Grid subscription of the analyze Function.
  postdeploy:
    shell: sh
    run: sh infra/hooks/postdeploy.sh
