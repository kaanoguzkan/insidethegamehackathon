# Azure Developer CLI service map. `azd up` provisions infra/ and deploys both services.
name: matchmind
metadata:
  template: matchmind@0.1.0
infra:
  provider: bicep
  path: infra
services:
  brain:
    project: .
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
      # ACR cloud builds (Tasks) are refused on new and free subscriptions, so build locally. Azure runs amd64, so force it
      # on Apple Silicon too.
      remoteBuild: false
      platform: linux/amd64
  web:
    project: ./web
    host: staticwebapp
    language: js
    dist: dist
    hooks:
      prebuild:
        shell: sh
        run: pnpm install --frozen-lockfile && pnpm sync
