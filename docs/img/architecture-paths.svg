<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 740" width="1640" height="740" role="img" aria-label="The same stages run in two shapes: in one process for a viewer who is watching, or as events across Azure services for the cloud-native demonstration." font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif"><title>Two live paths</title><desc>The same stages run in two shapes: in one process for a viewer who is watching, or as events across Azure services for the cloud-native demonstration.</desc><defs><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2c14e"/></marker></defs><rect width="1640" height="740" fill="#0d1310"/><text x="40" y="44" font-size="24" font-weight="800" fill="#eef3ee" text-anchor="start">Two live paths, the same stages</text><text x="40" y="68" font-size="13" font-weight="400" fill="#9fb0a5" text-anchor="start">What changes is the transport between the stages, not the stages: in memory for the viewer&#x27;s match, events across Azure for the cloud pipeline.</text><rect x="30" y="96" width="1580" height="250" rx="14" fill="#141c18" stroke="#f2c14e" stroke-width="1.5" opacity="1.0"/><text x="46" y="122" font-size="12" font-weight="800" fill="#f2c14e" text-anchor="start">WATCH LIVE   one viewer, one process, own clock (the match center&#x27;s button)</text><rect x="40" y="142" width="150" height="96" rx="10" fill="#1b2520" stroke="#3a4a41" stroke-width="1.5" opacity="1.0"/><text x="52" y="164" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Match player</text><text x="52" y="184" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">plays the demo at</text><text x="52" y="201" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">1x, 5x or 10x</text><rect x="240" y="142" width="150" height="96" rx="10" fill="#1b2520" stroke="#f2c14e" stroke-width="1.5" opacity="1.0"/><text x="252" y="164" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Video feed</text><text x="252" y="184" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">render, detect, track;</text><text x="252" y="201" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">skips if it falls behind</text><rect x="440" y="142" width="150" height="96" rx="10" fill="#1b2520" stroke="#3a4a41" stroke-width="1.5" opacity="1.0"/><text x="452" y="164" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Analyzer</text><text x="452" y="184" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">speeds, sprints, pass</text><text x="452" y="201" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">difficulty, shot speed</text><rect x="640" y="142" width="150" height="96" rx="10" fill="#1b2520" stroke="#3a4a41" stroke-width="1.5" opacity="1.0"/><text x="652" y="164" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Interpreter</text><text x="652" y="184" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">metrics, moments,</text><text x="652" y="201" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">evidence packs</text><rect x="840" y="142" width="150" height="96" rx="10" fill="#1b2520" stroke="#3a4a41" stroke-width="1.5" opacity="1.0"/><text x="852" y="164" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Dispatcher</text><text x="852" y="184" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">one verified story per</text><text x="852" y="201" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">viewer; beat cache</text><rect x="1040" y="142" width="150" height="96" rx="10" fill="#1b2520" stroke="#b392f0" stroke-width="1.5" opacity="1.0"/><text x="1052" y="164" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Foundry agents</text><text x="1052" y="184" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">Composer, Verifier</text><text x="1052" y="201" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">gpt-6-luna</text><rect x="1240" y="142" width="150" height="96" rx="10" fill="#1b2520" stroke="#4fd1b0" stroke-width="1.5" opacity="1.0"/><text x="1252" y="164" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Session store</text><text x="1252" y="184" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">in memory: only what</text><text x="1252" y="201" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">the clock has reached</text><rect x="1440" y="142" width="150" height="96" rx="10" fill="#1b2520" stroke="#3a4a41" stroke-width="1.5" opacity="1.0"/><text x="1452" y="164" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Browser</text><text x="1452" y="184" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">polls the feed ~0.7 s</text><text x="1452" y="201" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">pitch and overlays</text><polyline points="192,190.0 237,190.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="214.5" y="182.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">chunks</text><polyline points="392,190.0 437,190.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="414.5" y="182.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tracking</text><polyline points="592,190.0 637,190.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="614.5" y="182.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">facts</text><polyline points="792,190.0 837,190.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="814.5" y="182.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">moments</text><polyline points="992,190.0 1037,190.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="1014.5" y="182.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">evidence</text><polyline points="1192,190.0 1237,190.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="1214.5" y="182.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">stories</text><polyline points="1392,190.0 1437,190.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="1414.5" y="182.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">poll</text><text x="46" y="282" font-size="12.5" font-weight="600" fill="#eef3ee" text-anchor="start">0 network hops between stages: every stage is a function call inside the Brain (Azure Container Apps, 2 vCPU).</text><text x="46" y="304" font-size="12" font-weight="400" fill="#9fb0a5" text-anchor="start">A viewer&#x27;s match has its own store and clock, so nothing from their future can be in it. Measured on Azure: about 2 s from a moment to its story when warm.</text><text x="46" y="324" font-size="12" font-weight="400" fill="#9fb0a5" text-anchor="start">Cost of the choice: a live match lives in one replica&#x27;s memory, so the Brain is one always-on replica with at most 6 live matches.</text><rect x="30" y="440" width="1580" height="270" rx="14" fill="#141c18" stroke="#4aa3ff" stroke-width="1.5" opacity="1.0"/><text x="46" y="466" font-size="12" font-weight="800" fill="#4aa3ff" text-anchor="start">CLOUD PIPELINE   event-driven across Azure services, one match at a time (#pipeline)</text><rect x="40" y="486" width="150" height="96" rx="10" fill="#1b2520" stroke="#4aa3ff" stroke-width="1.5" opacity="1.0"/><text x="52" y="508" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Container Apps Job</text><text x="52" y="528" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">plays the match,</text><text x="52" y="545" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">~20 s to start</text><rect x="240" y="486" width="150" height="96" rx="10" fill="#1b2520" stroke="#4fd1b0" stroke-width="1.5" opacity="1.0"/><text x="252" y="508" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Cosmos + Blob</text><text x="252" y="528" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">events in Cosmos DB,</text><text x="252" y="545" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">5 s chunks in Blob</text><rect x="440" y="486" width="150" height="96" rx="10" fill="#1b2520" stroke="#4aa3ff" stroke-width="1.5" opacity="1.0"/><text x="452" y="508" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Event Grid</text><text x="452" y="528" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">BlobCreated wakes</text><text x="452" y="545" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">the analyzer</text><rect x="640" y="486" width="150" height="96" rx="10" fill="#1b2520" stroke="#4aa3ff" stroke-width="1.5" opacity="1.0"/><text x="652" y="508" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Functions</text><text x="652" y="528" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">analyze, interpret,</text><text x="652" y="545" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">dispatch, push</text><rect x="840" y="486" width="150" height="96" rx="10" fill="#1b2520" stroke="#4aa3ff" stroke-width="1.5" opacity="1.0"/><text x="852" y="508" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Brain /beats</text><text x="852" y="528" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">fast path: one verified</text><text x="852" y="545" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">story per viewer</text><rect x="1040" y="486" width="150" height="96" rx="10" fill="#1b2520" stroke="#b392f0" stroke-width="1.5" opacity="1.0"/><text x="1052" y="508" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Foundry agents</text><text x="1052" y="528" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">Composer, Verifier</text><text x="1052" y="545" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">gpt-6-luna</text><rect x="1240" y="486" width="150" height="96" rx="10" fill="#1b2520" stroke="#4aa3ff" stroke-width="1.5" opacity="1.0"/><text x="1252" y="508" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Azure SignalR</text><text x="1252" y="528" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">pushes each overlay</text><text x="1252" y="545" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">as it is stored</text><rect x="1440" y="486" width="150" height="96" rx="10" fill="#1b2520" stroke="#3a4a41" stroke-width="1.5" opacity="1.0"/><text x="1452" y="508" font-size="13.5" font-weight="700" fill="#eef3ee" text-anchor="start">Browser</text><text x="1452" y="528" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">#pipeline page,</text><text x="1452" y="545" font-size="11.5" font-weight="400" fill="#9fb0a5" text-anchor="start">stage counters</text><polyline points="192,534.0 237,534.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="214.5" y="526.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">events</text><polyline points="392,534.0 437,534.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="414.5" y="526.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">created</text><polyline points="592,534.0 637,534.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="614.5" y="526.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">trigger</text><polyline points="792,534.0 837,534.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="814.5" y="526.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">request</text><polyline points="992,534.0 1037,534.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="1014.5" y="526.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">calls</text><polyline points="1192,534.0 1237,534.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="1214.5" y="526.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">stored</text><polyline points="1392,534.0 1437,534.0" fill="none" stroke="#f2c14e" stroke-width="2" marker-end="url(#a-accent)" stroke-linejoin="round"/><text x="1414.5" y="526.0" font-size="11" font-weight="600" fill="#f2c14e" text-anchor="middle" stroke="#0d1310" stroke-width="4" paint-order="stroke" stroke-linejoin="round">push</text><text x="46" y="626" font-size="12.5" font-weight="600" fill="#eef3ee" text-anchor="start">7 network hops: every stage is its own service that scales, retries and fails on its own, and hands the next one work through a change feed or an event.</text><text x="46" y="648" font-size="12" font-weight="400" fill="#9fb0a5" text-anchor="start">Slower to start and about 12 s from a moment to its story, but it is the production shape: events in, nothing shared in memory, the stages replaceable one by one.</text><circle cx="52" cy="665" r="5.5" fill="#f2c14e"/><text x="64" y="669" font-size="12" font-weight="400" fill="#9fb0a5" text-anchor="start">Same code in both lanes: the analyzer, the interpreter, the agents and the Verifier are imported by the Brain&#x27;s stream session and by the Functions alike.</text><circle cx="576" cy="156" r="5.5" fill="#f2c14e"/><circle cx="776" cy="156" r="5.5" fill="#f2c14e"/><circle cx="976" cy="156" r="5.5" fill="#f2c14e"/><circle cx="1176" cy="156" r="5.5" fill="#f2c14e"/><circle cx="776" cy="500" r="5.5" fill="#f2c14e"/><circle cx="976" cy="500" r="5.5" fill="#f2c14e"/><circle cx="1176" cy="500" r="5.5" fill="#f2c14e"/></svg>
