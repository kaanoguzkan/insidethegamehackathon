name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: also runs the slow realism test

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check src tests apps
      - name: Tests (fast)
        if: github.event_name != 'schedule'
        run: uv run pytest -m "not slow"
      - name: Tests (everything, including the realism bands)
        if: github.event_name == 'schedule'
        run: uv run pytest
      - name: Quality gates over the committed replay packages
        run: uv run matchmind evals --out evals-report.json
      - name: JSON Schemas are in sync with the contracts
        run: |
          uv run matchmind export-schemas
          git diff --exit-code schemas
      - name: "Replay packages are reproducible (informational, since bit-identical floats across CPUs are not guaranteed)"
        continue-on-error: true
        run: |
          uv run matchmind build-replay pressing-collapse
          git diff --exit-code data/replays/pressing-collapse
      - uses: actions/upload-artifact@v4
        with: { name: evals-report, path: evals-report.json }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t matchmind-brain .
      - name: Smoke test the image
        run: |
          docker run -d --name brain -p 8000:8000 matchmind-brain
          timeout 60 sh -c 'until curl -sf localhost:8000/health; do sleep 1; done'
          curl -sf localhost:8000/api/matches
          curl -sf localhost:8000/api/matches/pressing-collapse/analytics | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['possessionValue']['available'] and d['season']"
          docker logs brain
