# The fallback mirror: the same replay-only build on GitHub Pages, so the judge link keeps working
# even if anything on Azure is down or its credit has run out. No backend, no model calls.
name: pages

on:
  push: { branches: [main], paths: ["web/**", "data/replays/**", ".github/workflows/pages.yml"] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # base './' keeps asset URLs relative, so it works under /<repo>/
        env:
          # The Brain API the Live AI mode calls. Set the repository variable BRAIN_URL to point somewhere else.
          VITE_BRAIN_URL: ${{ vars.BRAIN_URL || 'https://ca-matchmind-brain.ambitiouswave-e3f38943.northeurope.azurecontainerapps.io' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
