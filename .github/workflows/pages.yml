# The portfolio mirror: the replay-only build on GitHub Pages (kaanoguzkan.com/insidethegamehackathon/), with the demo video. No backend, no model calls,
# so it keeps working with Azure switched off. To point it at a Brain again, set the repository variable BRAIN_URL.
name: pages

on:
  push: { branches: [main], paths: ["web/**", "data/replays/**", ".github/workflows/pages.yml"] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # base './' keeps asset URLs relative, so it works under /<repo>/
        env:
          # Empty: no Brain, so the build is replay-only (no Live, Ask, Cloud pipeline or Operations) and its menu has the demo video.
          VITE_BRAIN_URL: ${{ vars.BRAIN_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
