[project]
name = "matchmind"
version = "0.1.0"
description = "Explainable, personalized football match intelligence from synthetic events (Microsoft x Premier League Inside the Game hackathon)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  # Microsoft Agent Framework: the core package only. The `agent-framework` meta-package pulls in
  # about 30 provider packages this project does not use.
  "agent-framework-core>=1.20",
  "mcp>=1.30,<2",
]

[project.optional-dependencies]
# Any OpenAI-compatible endpoint: GitHub Models, Ollama, Azure OpenAI v1.
openai = ["agent-framework-openai>=1.15"]
# A Microsoft Foundry project (model deployments, hosted agents, tracing, evaluations).
foundry = ["agent-framework-foundry>=1.14", "azure-identity>=1.19"]
# The Brain service: REST API plus the MCP server over streamable HTTP.
brain = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
# Azure adapters (Cosmos DB, Blob Storage, SignalR publishing, telemetry).
azure = [
  "azure-cosmos>=4.7", "azure-storage-blob>=12.20", "azure-identity>=1.19",
  "azure-functions>=1.20", "azure-monitor-opentelemetry>=1.6",
]
report = [
    "reportlab>=4.2",
]

[project.scripts]
matchmind = "matchmind.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "agent-framework-openai>=1.15",
    "reportlab>=4.2",
    "pypdf>=6.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
markers = [
  "slow: simulates many matches; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
