[project]
name = "matchmind"
version = "0.1.0"
description = "Explainable, personalized football match intelligence from synthetic events (Microsoft x Premier League Inside the Game hackathon)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
# Model access. Works with Microsoft Foundry, GitHub Models and Ollama
# through one OpenAI-compatible client.
llm = ["openai>=1.50"]
# The Brain service (REST API, MCP server) and its agent runtime.
brain = ["fastapi>=0.115", "uvicorn>=0.30", "mcp>=1.2", "openai>=1.50"]

[project.scripts]
matchmind = "matchmind.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: simulates many matches; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
