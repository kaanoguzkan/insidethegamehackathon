<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rifinitore end card</title>
<!-- End card for the demo video: serve the repo root over http and open demo/pages/end.html -->
<style>
  html, body { margin: 0; height: 100%; background: #0d1512; color: #f2f5f3; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px; padding: 0 6vw; }
  .mark { width: 72px; height: 72px; border: 8px solid #f2b632; border-radius: 50%; position: relative; }
  .mark::after { content: ""; position: absolute; inset: 20px; background: #f2b632; border-radius: 50%; }
  h1 { font-size: 84px; margin: 0; letter-spacing: -1px; }
  p.line { font-size: 38px; margin: 0; color: #d8e0dc; }
  p.tech { font-size: 26px; margin: 8px 0 0; color: #98a8a1; }
  p.repo { font-size: 28px; margin: 0; color: #f2b632; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>Rifinitore</h1>
  <p class="line">Football, explained as it happens, and checked.</p>
  <p class="tech">Microsoft Foundry · Agent Framework · Azure Container Apps · Event Grid · Functions · Cosmos DB · SignalR</p>
  <p class="repo">github.com/kaanoguzkan/insidethegamehackathon</p>
  <p class="tech">All data is synthetic. Clubs and players are fictional.</p>
</main>
</body>
</html>
